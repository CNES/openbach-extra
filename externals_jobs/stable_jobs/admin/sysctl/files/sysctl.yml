---

general:
  name:            sysctl
  description: >
      This Job allows to configure one sysctl parameter.
  job_version:     '1.1'
  keywords:        [sysctl]
  persistent:      true

platform_configuration:
  ansible_system: 'Debian'
  ansible_distribution: 'Ubuntu'
  command: '/opt/openbach/virtualenv/bin/python3 /opt/openbach/agent/jobs/sysctl/sysctl.py'
  command_stop:
  supported_platforms:
    - ansible_distribution_release: 'focal'
    - ansible_distribution_release: 'jammy'
    - ansible_distribution_release: 'noble'
    - ansible_distribution: 'Debian'
      ansible_distribution_release: 'bookworm'

arguments:
  required:
    - name:        parameter
      type:        'str'
      count:       1
      description: >
          The parameter name.
    - name:        value
      type:        'str'
      count:       1
      description: >
          The parameter value.
  optional:

statistics:
